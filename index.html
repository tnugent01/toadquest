<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toad Quest: The Sacred Scrolls</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <h1>Toad Quest: The Sacred Scrolls</h1>
        <div id="canvas-wrapper">
            <div id="canvas-inner">
                <canvas id="gameCanvas" width="800" height="450"></canvas>
            </div>

            <!-- JRPG-style dialogue overlay -->
            <div id="chat-overlay" class="hidden">
                <div id="chat-dialogue-box">
                    <div id="chat-history"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="Type your message..." autocomplete="off">
                        <button type="button" id="chat-send">Send</button>
                        <button type="button" id="chat-close">Leave</button>
                    </div>
                </div>
            </div>
        </div>
        <p class="instructions">Controls: ← → Move | ↑ or Space Jump | E Interact | R Reset</p>
    </div>
    <script src="game.js?v=6"></script>
</body>

</html>
